services:
  fraudshield:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist audit logs outside the container
      - ./var/audit:/app/var/audit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
