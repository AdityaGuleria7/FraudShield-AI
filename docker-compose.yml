services:
  fraudshield:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Audit logs persist outside the container. On Linux hosts run
      # `mkdir -p var/audit && sudo chown 1000:1000 var/audit` once.
      - ./var/audit:/app/var/audit
      # Optional trained model (see README: "Get the model"). Read-only.
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
